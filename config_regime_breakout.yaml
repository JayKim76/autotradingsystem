# 레짐 조건부 돌파 전략 설정 (레짐돌파전략설계.md 참조)
# 돌파형 파라미터는 config_breakout.yaml과 동일하게 유지한다 — 변경점은 브레드스 게이트뿐.
regime_breakout:
  breakout_days: 20
  exit_channel_days: 10
  volume_mult: 1.5
  atr_period: 14
  stop_atr_mult: 2.0
  max_hold_days: 20
  risk_pct: 0.75
  max_position_pct: 25
  max_positions: 4
  max_entries_per_day: 2
  min_avg_value_krw: 5000000000
  gap_up_limit_pct: 2.0
  gap_down_limit_pct: 5.0
  regime_symbol: "069500"
  breadth_ma_period: 60
  breadth_threshold: 0.5
  breadth_min_symbols: 20
